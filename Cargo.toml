[workspace]
resolver = "2"
members = [
    "crates/scheduler-proto",
    "crates/fragmenter",
    "crates/scheduler",
    "crates/mock-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-stream = "0.1"
